name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://getnami.dev' }}
  NEXT_PUBLIC_ALLOW_INDEXING: ${{ vars.NEXT_PUBLIC_ALLOW_INDEXING || 'false' }}
  NEXT_PUBLIC_REPO_PUBLIC: ${{ vars.NEXT_PUBLIC_REPO_PUBLIC || 'false' }}
  NEXT_PUBLIC_REPO_URL: ${{ vars.NEXT_PUBLIC_REPO_URL || 'https://github.com/namphuongtran/nami' }}
  NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL || 'me@getnami.dev' }}
  NEXT_PUBLIC_CONTACT_FORM_ACTION: ${{ vars.NEXT_PUBLIC_CONTACT_FORM_ACTION }}
  NEXT_PUBLIC_NEWSLETTER_FORM_ACTION: ${{ vars.NEXT_PUBLIC_NEWSLETTER_FORM_ACTION }}
  NEXT_PUBLIC_GSC_VERIFICATION: ${{ vars.NEXT_PUBLIC_GSC_VERIFICATION }}
  NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.NEXT_PUBLIC_CF_BEACON_TOKEN }}
  NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}

jobs:
  verify:
    name: Lint, typecheck, build, checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm check:content
      - run: pnpm build
      - run: pnpm check:copy
      - run: pnpm check:output
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: site
          path: out
          include-hidden-files: true
          retention-days: 7

  links:
    name: Link check
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8.0.2
        with:
          name: site
          path: out
      - name: Serve with Cloudflare Pages emulation and crawl
        run: |
          pnpm preview > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8788/ && break; sleep 1; done
          curl -sI http://localhost:8788/ | grep -i "content-security-policy"
          curl -sI http://localhost:8788/ | grep -i "strict-transport-security"
          pnpm exec linkinator http://localhost:8788 --recurse --skip "^(?!http://localhost:8788)"

  lighthouse:
    name: Lighthouse
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: site
          path: out
      - uses: treosh/lighthouse-ci-action@12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [verify, links]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check for Cloudflare credentials
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "No CLOUDFLARE_API_TOKEN secret; skipping deploy."; fi
      - uses: actions/checkout@v7.0.1
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/download-artifact@v8.0.2
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: site
          path: out
      - uses: cloudflare/wrangler-action@v4.1.3
        if: steps.gate.outputs.enabled == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=getnami --branch=${{ github.head_ref || github.ref_name }}
